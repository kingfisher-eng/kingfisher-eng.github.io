---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    body {
      margin: 0;
      font: 16px/1.6 system-ui, sans-serif;
      color: #222;
    }

    header, main, footer {
      max-width: 760px;
      margin: auto;
      padding: 1.5rem;
    }

    nav a {
      margin-right: 1rem;
    }

    section {
      min-height: 60vh;
      padding: 3rem 0;
      scroll-margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
    <nav aria-label="Main navigation">
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About</h2>
      <p>Replace this with your first section’s content.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Replace this with your second section’s content.</p>
    </section>
  </main>

  <footer>
    <small>© Your Name</small>
  </footer>
</body>
</html>
